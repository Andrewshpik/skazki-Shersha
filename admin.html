<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Админка · Сказки Шерша</title>
    <link rel="icon" type="image/png" href="shersh_cursor.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h1>🛡️ Админка «Сказки Шерша»</h1>
        <span class="me" id="meLabel" title="Аккаунт, от имени которого выполняются действия"></span>
        <span class="spacer"></span>
        <select id="themeSelect" class="btn btn-ghost" title="Тема">
            <option value="light">🌙 Светлая</option>
            <option value="dark">🌚 Тёмная</option>
            <option value="lavender">💜 Лавандовая</option>
            <option value="mint">🌿 Мятная</option>
            <option value="skyblue">💙 Голубая</option>
            <option value="rose">🌷 Розовая</option>
        </select>
        <button class="btn btn-ghost" id="refreshBtn">🔄 Обновить</button>
        <a class="btn" href="index.html">← На сайт</a>
    </header>

    <main>
        <section class="gate" id="gate">
            <h2>Нужен вход</h2>
            <p id="gateText">Войди на сайте как Шерш — админка откроется только для администратора.</p>
            <a class="btn" href="index.html">Перейти на сайт</a>
        </section>

        <div id="admin" style="display:none;">
            <div class="stats" id="stats"></div>

            <div class="tabs">
                <button class="tab active" data-tab="reports">Жалобы <span class="count" id="cntReports"></span></button>
                <button class="tab" data-tab="users">Пользователи <span class="count" id="cntUsers"></span></button>
                <button class="tab" data-tab="banned">Забаненные <span class="count" id="cntBanned"></span></button>
                <button class="tab" data-tab="posts">Истории <span class="count" id="cntPosts"></span></button>
                <button class="tab" data-tab="comments">Комментарии <span class="count" id="cntComments"></span></button>
            </div>

            <div class="panel active" id="panel-reports"></div>
            <div class="panel" id="panel-users"></div>
            <div class="panel" id="panel-banned"></div>
            <div class="panel" id="panel-posts"></div>
            <div class="panel" id="panel-comments"></div>
        </div>
    </main>

    <div id="toasts"></div>

    <script src="admin.js?v=1"></script>
</body>
</html>
