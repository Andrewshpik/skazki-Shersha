name: keep-alive

on:
  schedule:
    # каждые 10 минут, чтобы сервер Netrun free не «засыпал»
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping сервис Netrun
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code} за %{time_total}s\n" \
            "https://shersh-auth.de1.netrun.io/api/posts" || \
            echo "Сервер не ответил (возможно, просыпается)"