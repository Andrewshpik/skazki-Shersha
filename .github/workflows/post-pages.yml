name: Страницы историй

# Раз в сутки (и по кнопке) пересобирает post-<id>.html и sitemap.xml
# из API: новые истории получают собственные адреса с мета-тегами.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Собрать страницы
        run: python tools/build_post_pages.py

      - name: Закоммитить изменения
        run: |
          git config user.name "shersh-pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add post-*.html sitemap.xml
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Обновлены страницы историй и sitemap"
            git push
          fi
