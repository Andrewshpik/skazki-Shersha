name: Бэкенд не спит

# Бесплатный тариф Netrun усыпляет контейнер после простоя, и первый
# посетитель ждёт 10–30 секунд. Пинг каждые 10 минут держит его живым.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить бэкенд
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://shersh-auth.de1.netrun.io/check_auth || true)
            echo "попытка $i: код $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "бэкенд не ответил — возможно, упал"
          exit 1

      - name: Сообщить о падении
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Бэкенд не отвечает';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'мониторинг'
            });
            if (open.length) {
              console.log('Уже есть открытая задача: #' + open[0].number);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['мониторинг'],
              body: [
                'Проверка `keepalive` не получила 200 от `/check_auth` три раза подряд.',
                '',
                `Время: ${new Date().toISOString()}`,
                'Ссылка на прогон: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                '',
                'Что делать: открыть https://netrun.io/projects/5874 и разбудить сервис.'
              ].join('\n')
            });

      - name: Закрыть задачу после восстановления
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'мониторинг'
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Бэкенд снова отвечает, закрываю.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
