<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сказки Шерша</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #2c3e50;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --gold-accent: #FFD700;
            --gold-hover: #FFC107;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --border-color: #e1e8ed;
            --comment-bg: #f9f9f9;
            --input-bg: #ffffff;
            --error-color: #e74c3c;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --header-bg: #16213e;
            --card-bg: #1f2b4d;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --border-color: #2a3b66;
            --comment-bg: #16213e;
            --input-bg: #16213e;
        }

        /* --- ГЛАВНЫЙ КУРСОР-ШЕРШ --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            cursor: url('shersh_cursor.png') 16 16, auto; 
        }

        /* --- КУРСОР-ШЕРШ НА КНОПКАХ И ССЫЛКАХ --- */
        button, a, .action-btn, .btn, .theme-toggle, .user-info, .edit-icon {
            cursor: url('shersh_cursor.png') 16 16, pointer !important;
        }

        /* --- ШАПКА --- */
        header {
            background-color: var(--header-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background-color 0.3s;
        }

        .nav-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-panel h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-info {
            font-size: 0.9rem;
            color: var(--gold-accent);
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .user-info:hover {
            background-color: rgba(255, 215, 0, 0.1);
        }

        /* --- КНОПКИ --- */
        .btn {
            background-color: var(--gold-accent);
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--gold-hover);
            transform: scale(1.05);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            padding: 5px;
            transition: transform 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.2) rotate(15deg);
        }

        /* --- УВЕДОМЛЕНИЯ (ТОСТЫ) --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 5px solid var(--gold-accent);
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
        }

        .toast.error {
            border-left-color: var(--error-color);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* --- ОРАНЖЕВЫЕ ИСКРЫ-ЗВЕЗДОЧКИ --- */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            color: #FF8C00; 
            font-size: 16px;
            text-shadow: 0 0 5px #FFD700, 0 0 10px #FF4500; 
            animation: sparkle-fade 0.8s ease-out forwards;
        }

        @keyframes sparkle-fade {
            0% { transform: scale(0.5) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) translateY(-40px) rotate(90deg); opacity: 0; }
        }

        /* --- ЛЕНТА С ИСТОРИЯМИ --- */
        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .post-card h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--text-color);
            font-size: 1.4rem;
        }

        .post-meta {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .post-content {
            line-height: 1.6;
            margin-bottom: 20px;
            color: var(--text-color);
            white-space: pre-wrap;
        }

        .post-actions {
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0.8;
            transition: opacity 0.2s, color 0.2s;
        }

        .action-btn:hover {
            opacity: 1;
            color: var(--gold-accent);
        }

        .action-btn.liked {
            color: var(--gold-accent);
            font-weight: bold;
            opacity: 1;
        }

        /* --- МОДАЛЬНЫЕ ОКНА --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow);
            max-height: 80vh;
            overflow-y: auto;
            text-align: center; 
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--text-color);
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            text-align: left; 
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 80px;
        }

        .field-error {
            color: var(--error-color);
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        /* --- КОММЕНТАРИИ --- */
        .comments-list {
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .comment-item {
            background-color: var(--comment-bg);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #888;
            margin-bottom: 5px;
        }

        .comment-author {
            font-weight: bold;
            color: var(--text-color);
        }

        .comment-text {
            font-size: 0.95em;
            line-height: 1.4;
            color: var(--text-color);
            word-break: break-word;
        }

        /* --- ПРОФИЛЬ --- */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--border-color);
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            border: 3px solid var(--gold-accent);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            font-size: 3rem;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .avatar-edit-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 0.7rem;
            padding: 5px 0;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .avatar-container:hover .avatar-edit-overlay {
            opacity: 1;
        }

        .profile-info h2 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-nickname {
            color: var(--gold-accent);
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .edit-icon {
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
        }

        .edit-icon:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .profile-bio {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- КОНТЕЙНЕР ДЛЯ УВЕДОМЛЕНИЙ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ОКНО ВХОДА (Регистрация через Telegram) -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <h2>👑 Добро пожаловать в Сказки Шерша!</h2>
            <p>Войди через Telegram, чтобы Шерш знал, кто ты.</p>
            
            <!-- КНОПКА ВХОДА ЧЕРЕЗ TELEGRAM -->
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="shersh_auth_bot" 
                    data-size="large" 
                    data-onauth="onTelegramAuth(user)" 
                    data-request-access="write"></script>
        </div>
    </div>

    <!-- ОКНО РЕДАКТИРОВАНИЯ ПРОФИЛЯ -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal-content">
            <h2>Редактировать профиль</h2>
            
            <label style="font-size: 0.9rem; color: var(--text-color); text-align: left; display: block;">Имя:</label>
            <input type="text" id="editNameInput" placeholder="Твое имя">
            <div class="field-error" id="editNameError">Это имя уже занято!</div>

            <label style="font-size: 0.9rem; color: var(--text-color); text-align: left; display: block;">Никнейм:</label>
            <input type="text" id="editNicknameInput" placeholder="@nickname">
            <div class="field-error" id="editNickError">Этот ник уже занят!</div>

            <label style="font-size: 0.9rem; color: var(--text-color); text-align: left; display: block;">О себе:</label>
            <textarea id="editBioInput" placeholder="Расскажи о себе..."></textarea>
            
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelEditBtn">Отмена</button>
                <button class="btn" id="saveEditBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <header>
        <div class="nav-panel">
            <h1 onclick="showPage('feed')">👑 Сказки Шерша</h1>
            
            <div style="display: flex; gap: 15px; align-items: center;">
                <span class="user-info" id="headerProfileBtn" onclick="showPage('profile')">👋 Гость</span>
                <button class="theme-toggle" id="themeToggle" title="Переключить тему">🌙</button>
                <button class="btn" id="addPostBtn">Добавить историю</button>
            </div>
        </div>
    </header>

    <!-- СТРАНИЦА: ЛЕНТА -->
    <main id="feed-page">
        <div id="posts-container"></div>
    </main>

    <!-- СТРАНИЦА: ПРОФИЛЬ -->
    <main id="profile-page" style="display: none;">
        <div class="profile-header">
            <div class="avatar-container" id="avatarContainer" onclick="document.getElementById('avatarInput').click()">
                <img id="avatarImage" src="" alt="Аватар" style="display: none;">
                <div class="avatar-placeholder" id="avatarPlaceholder">👤</div>
                <div class="avatar-edit-overlay">Изменить</div>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display: none;">

            <div class="profile-info">
                <h2>
                    <span id="profileNameDisplay">Имя</span>
                    <span class="edit-icon" onclick="openEditProfile('name')" title="Изменить имя">✏️</span>
                </h2>
                <div class="profile-nickname">
                    <span id="profileNickDisplay">@ник</span>
                    <span class="edit-icon" onclick="openEditProfile('nick')" title="Изменить ник">✏️</span>
                </div>
                <div class="profile-bio" id="profileBioDisplay">О себе пока ничего не написано...</div>
                <div class="stats">
                    <span>📝 Историй: <b id="statPosts">0</b></span>
                    <span>👍 Лайков: <b id="statLikes">0</b></span>
                </div>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn" id="editProfileBtn">Редактировать профиль</button>
            <button class="btn btn-cancel" id="logoutBtn">Выйти</button>
        </div>
    </main>

    <!-- ОКНО ДОБАВЛЕНИЯ ПОСТА -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-content">
            <h2>Новая история</h2>
            <input type="text" id="postTitle" placeholder="Заголовок (О чем история?)">
            <textarea id="postText" placeholder="Текст истории..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelBtn">Отмена</button>
                <button class="btn" id="submitPostBtn">Опубликовать!</button>
            </div>
        </div>
    </div>

    <!-- ОКНО КОММЕНТАРИЕВ -->
    <div class="modal-overlay" id="commentsModal">
        <div class="modal-content">
            <h2>💬 Комментарии</h2>
            <div class="comments-list" id="commentsList"></div>
            <textarea id="commentInput" placeholder="Написать комментарий..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="closeCommentsBtn">Закрыть</button>
                <button class="btn" id="submitCommentBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // --- ФУНКЦИЯ АВТОРИЗАЦИИ ЧЕРЕЗ TELEGRAM ---
        function onTelegramAuth(user) {
            console.log("Данные от Telegram:", user);
            
            // ⚠️ ВСТАВЬ СЮДА СВОЙ АДРЕС ОТ NETRUN (без https://)
            fetch('https://shersh-auth.de1.netrun.io/auth/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    userData.name = data.user;
                    userData.nickname = '@' + (user.username || 'user');
                    localStorage.setItem('shersh_user', JSON.stringify(userData));
                    
                    loginModal.style.display = 'none';
                    updateHeaderUI();
                    showToast(`Добро пожаловать, ${data.user}!`);
                    location.reload(); 
                } else {
                    showToast('Ошибка авторизации', true);
                }
            })
            .catch(err => {
                console.error(err);
                showToast('Сервер не отвечает', true);
            });
        }

        // --- ОРАНЖЕВЫЕ ИСКРЫ ---
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.4) return;
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerHTML = '✦';
            sparkle.style.left = (e.clientX - 8) + 'px';
            sparkle.style.top = (e.clientY - 8) + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
        });

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = '✦';
                const offsetX = (Math.random() - 0.5) * 80;
                const offsetY = (Math.random() - 0.5) * 80;
                sparkle.style.left = (e.clientX - 8) + 'px';
                sparkle.style.top = (e.clientY - 8) + 'px';
                sparkle.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 800);
            }
        });

        // --- СИСТЕМА УВЕДОМЛЕНИЙ ---
        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease-in reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- БАЗА ПОЛЬЗОВАТЕЛЕЙ ---
        let usersDB = JSON.parse(localStorage.getItem('shersh_users_db')) || [];
        if (!usersDB.find(u => u.nickname.toLowerCase() === '@шерш')) {
            usersDB.push({ name: 'Шерш', nickname: '@Шерш' });
            saveUsersDB();
        }

        function saveUsersDB() {
            localStorage.setItem('shersh_users_db', JSON.stringify(usersDB));
        }

        let userData = JSON.parse(localStorage.getItem('shersh_user')) || {
            name: '', nickname: '', bio: '', avatar: ''
        };

        const loginModal = document.getElementById('loginModal');
        const editProfileModal = document.getElementById('editProfileModal');

        function checkAuth() {
            if (!userData.name) {
                loginModal.style.display = 'flex';
            } else {
                updateHeaderUI();
            }
        }

        function saveUserData() {
            localStorage.setItem('shersh_user', JSON.stringify(userData));
            updateHeaderUI();
            updateProfileUI();
        }

        function updateHeaderUI() {
            const btn = document.getElementById('headerProfileBtn');
            btn.textContent = userData.name ? `👋 ${userData.name}` : '👋 Гость';
        }

        function showPage(page) {
            if (!userData.name) return;
            document.getElementById('feed-page').style.display = page === 'feed' ? 'block' : 'none';
            document.getElementById('profile-page').style.display = page === 'profile' ? 'block' : 'none';
            if (page === 'profile') updateProfileUI();
        }

        function updateProfileUI() {
            document.getElementById('profileNameDisplay').textContent = userData.name;
            document.getElementById('profileNickDisplay').textContent = userData.nickname;
            document.getElementById('profileBioDisplay').textContent = userData.bio || 'О себе пока ничего не написано...';
            
            const avatarImg = document.getElementById('avatarImage');
            const avatarPlaceholder = document.getElementById('avatarPlaceholder');
            
            if (userData.avatar) {
                avatarImg.src = userData.avatar;
                avatarImg.style.display = 'block';
                avatarPlaceholder.style.display = 'none';
            } else {
                avatarImg.style.display = 'none';
                avatarPlaceholder.style.display = 'flex';
            }

            let myPosts = posts.filter(p => p.author === userData.name);
            let totalLikes = myPosts.reduce((sum, p) => sum + p.likes, 0);
            document.getElementById('statPosts').textContent = myPosts.length;
            document.getElementById('statLikes').textContent = totalLikes;
        }

        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userData.avatar = event.target.result;
                    saveUserData();
                    showToast('Аватар обновлен!');
                };
                reader.readAsDataURL(file);
            }
        });

        window.openEditProfile = function(focusField) {
            document.getElementById('editNameInput').value = userData.name;
            document.getElementById('editNicknameInput').value = userData.nickname;
            document.getElementById('editBioInput').value = userData.bio;
            document.getElementById('editNameError').style.display = 'none';
            document.getElementById('editNickError').style.display = 'none';
            editProfileModal.style.display = 'flex';
            if (focusField === 'name') document.getElementById('editNameInput').focus();
            if (focusField === 'nick') document.getElementById('editNicknameInput').focus();
        };

        document.getElementById('editProfileBtn').addEventListener('click', () => openEditProfile(null));
        document.getElementById('cancelEditBtn').addEventListener('click', () => editProfileModal.style.display = 'none');

        document.getElementById('editNameInput').addEventListener('input', () => document.getElementById('editNameError').style.display = 'none');
        document.getElementById('editNicknameInput').addEventListener('input', () => document.getElementById('editNickError').style.display = 'none');

        document.getElementById('saveEditBtn').addEventListener('click', () => {
            let newName = document.getElementById('editNameInput').value.trim();
            let newNick = document.getElementById('editNicknameInput').value.trim();
            let newBio = document.getElementById('editBioInput').value.trim();

            if (newNick && !newNick.startsWith('@')) newNick = '@' + newNick;
            let hasError = false;

            if (newName.toLowerCase() !== userData.name.toLowerCase()) {
                if (usersDB.some(u => u.name.toLowerCase() === newName.toLowerCase())) {
                    document.getElementById('editNameError').style.display = 'block';
                    hasError = true;
                }
            }
            if (newNick.toLowerCase() !== userData.nickname.toLowerCase()) {
                if (usersDB.some(u => u.nickname.toLowerCase() === newNick.toLowerCase())) {
                    document.getElementById('editNickError').style.display = 'block';
                    hasError = true;
                }
            }

            if (!hasError) {
                const userIndex = usersDB.findIndex(u => u.name === userData.name);
                if (userIndex !== -1) {
                    usersDB[userIndex].name = newName;
                    usersDB[userIndex].nickname = newNick;
                    saveUsersDB();
                }
                userData.name = newName;
                userData.nickname = newNick;
                userData.bio = newBio;
                saveUserData();
                editProfileModal.style.display = 'none';
                showToast('Профиль успешно обновлен!');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Точно выйти?')) {
                localStorage.removeItem('shersh_user');
                location.reload();
            }
        });

        // --- ТЕМА ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.setAttribute('data-theme', 'dark');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                themeToggleBtn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        });

        // --- ДАТЫ ---
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()} в ${hh}:${mm}`;
        }

        // --- ПОСТЫ ---
        let posts = JSON.parse(localStorage.getItem('shersh_posts'));
        if (!posts) {
            posts = [
                {
                    id: 1, title: 'Добро пожаловать на наш сайт!', author: 'Андрей', date: new Date().toISOString(),
                    text: 'Привет! Это первый пост на нашем сайте. Здесь мы будем делиться сказками, историями из жизни, театральными закулисьями и всем, что захочется.\n\nШерш уже надел свою корону и готов читать ваши истории.',
                    likes: 12, isLiked: false, comments: [{ author: 'Шерш', date: new Date().toISOString(), text: 'Ура! Мой сайт работает!' }]
                }
            ];
            saveData();
        }

        const postsContainer = document.getElementById('posts-container');

        function renderPosts() {
            postsContainer.innerHTML = '';
            posts.forEach((post, index) => {
                const postElement = document.createElement('article');
                postElement.className = 'post-card';
                const dateStr = formatDate(post.date);
                const commentCount = post.comments ? post.comments.length : 0;

                postElement.innerHTML = `
                    <h2>${post.title}</h2>
                    <div class="post-meta">
                        <span>Автор: ${post.author}</span>
                        <span>•</span>
                        <span>${dateStr}</span>
                    </div>
                    <div class="post-content"><p>${post.text}</p></div>
                    <div class="post-actions">
                        <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike(${index})">
                            👍 Нравится (<span>${post.likes}</span>)
                        </button>
                        <button class="action-btn" onclick="openComments(${index})">
                            💬 Комментарии (${commentCount})
                        </button>
                    </div>
                `;
                postsContainer.appendChild(postElement);
            });
        }

        window.toggleLike = function(index) {
            posts[index].isLiked = !posts[index].isLiked;
            posts[index].likes += posts[index].isLiked ? 1 : -1;
            saveData();
            renderPosts();
        };

        const postModal = document.getElementById('postModal');
        document.getElementById('addPostBtn').addEventListener('click', () => {
            if(!userData.name) return;
            postModal.style.display = 'flex';
            document.getElementById('postTitle').value = '';
            document.getElementById('postText').value = '';
            document.getElementById('postTitle').focus();
        });

        document.getElementById('cancelBtn').addEventListener('click', () => { postModal.style.display = 'none'; });

        document.getElementById('submitPostBtn').addEventListener('click', () => {
            const title = document.getElementById('postTitle').value.trim();
            const text = document.getElementById('postText').value.trim();
            if (!title || !text) {
                showToast('Заполни заголовок и текст!', true);
                return;
            }
            const newPost = {
                id: Date.now(), title: title, author: userData.name, date: new Date().toISOString(),
                text: text, likes: 0, isLiked: false, comments: []
            };
            posts.unshift(newPost);
            saveData();
            renderPosts();
            postModal.style.display = 'none';
            showToast('История опубликована!');
        });

        const commentsModal = document.getElementById('commentsModal');
        const commentsList = document.getElementById('commentsList');
        const commentInput = document.getElementById('commentInput');
        let currentPostIndexForComments = null;

        window.openComments = function(index) {
            currentPostIndexForComments = index;
            renderComments();
            commentsModal.style.display = 'flex';
        };

        function renderComments() {
            commentsList.innerHTML = '';
            const comments = posts[currentPostIndexForComments].comments || [];
            if (comments.length === 0) {
                commentsList.innerHTML = '<p style="color: #888; text-align: center;">Пока нет комментариев. Будь первым!</p>';
            } else {
                comments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    div.innerHTML = `
                        <div class="comment-header">
                            <span class="comment-author">${c.author}</span>
                            <span>${formatDate(c.date)}</span>
                        </div>
                        <div class="comment-text">${c.text}</div>
                    `;
                    commentsList.appendChild(div);
                });
            }
            commentInput.value = '';
        }

        document.getElementById('closeCommentsBtn').addEventListener('click', () => { commentsModal.style.display = 'none'; });

        document.getElementById('submitCommentBtn').addEventListener('click', () => {
            const text = commentInput.value.trim();
            if (!text) return;
            const newComment = { author: userData.name, date: new Date().toISOString(), text: text };
            posts[currentPostIndexForComments].comments.push(newComment);
            saveData();
            renderPosts(); 
            renderComments();
            commentInput.value = '';
            showToast('Комментарий добавлен!');
        });

        function saveData() {
            localStorage.setItem('shersh_posts', JSON.stringify(posts));
        }

        // --- ЗАПУСК ---
        checkAuth();
        renderPosts();
    </script>

</body>
</html>
